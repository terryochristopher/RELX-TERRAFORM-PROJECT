
name: Terraform CI/CD

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform operation"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-pointclickcare
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./terraform

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  plan:
    name: Generate Terraform plan
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'destroy'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize remote state
        run: terraform init -input=false

      - name: Create Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan for approved apply
        if: inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Approve, apply and smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize remote state
        run: terraform init -input=false

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Apply saved Terraform plan
        run: terraform apply -input=false -no-color tfplan

      - name: Smoke test Hello World through ALB
        shell: bash
        run: |
          set -euo pipefail
          ALB_DNS="$(terraform output -raw alb_dns_name)"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              "http://${ALB_DNS}/" | grep -q 'Hello, World!'; then
              echo "Smoke test passed"
              exit 0
            fi

            echo "Waiting for healthy ALB targets..."
            sleep 10
          done

          echo "Smoke test failed"
          exit 1

  destroy:
    name: Approve and destroy infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize remote state
        run: terraform init -input=false

      - name: Destroy infrastructure
        run: terraform destroy -input=false -auto-approve -no-color
