# Optional: install Metrics Server in EKS before applying this resource.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-web
  namespace: sre-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
